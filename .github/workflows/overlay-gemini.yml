name: overlay-gemini (Windows .exe)

on:
  push:
    paths:
      - "overlay_gemini/**"
      - ".github/workflows/overlay-gemini.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay_gemini
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Compilar .exe
        run: python build.py

      - name: Selftest del .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\OverlayGemini\OverlayGemini.exe" `
                -ArgumentList "--selftest", "selftest.log" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "Selftest fallido ($($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: OverlayGemini-windows
          path: overlay_gemini/dist/OverlayGemini
          if-no-files-found: error
